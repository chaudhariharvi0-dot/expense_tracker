<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join SpendWise | Free Signup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #05070a; color: #ffffff; }
        .glass-card { background: rgba(15, 18, 26, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .input-field { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); outline: none; transition: 0.3s; }
        .input-field:focus { border-color: #6366f1; box-shadow: 0 0 15px rgba(99, 102, 241, 0.2); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">

    <a href="/" class="absolute top-8 left-8 text-gray-500 hover:text-white transition flex items-center gap-2 font-bold text-sm">
        <i class="fas fa-arrow-left"></i> BACK TO HOME
    </a>

    <div class="w-full max-w-md">
        <div class="glass-card p-10 rounded-[2.5rem]">
            <h2 class="text-3xl font-black mb-2 text-center">Get Started <span class="text-indigo-400">Free.</span></h2>
            <p class="text-gray-500 text-center text-sm mb-8 font-medium">Create your account below.</p>

            <form id="signupForm" class="space-y-5">

                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest ml-1">Full Name</label>
                    <input id="name" type="text" placeholder="Enter your name"
                        class="input-field w-full px-6 py-4 rounded-2xl text-sm" required>
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest ml-1">Email Address</label>
                    <input id="email" type="email" placeholder="name@email.com"
                        class="input-field w-full px-6 py-4 rounded-2xl text-sm" required>
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest ml-1">Create Password</label>
                    <input id="password" type="password" placeholder="Min. 8 characters"
                        class="input-field w-full px-6 py-4 rounded-2xl text-sm" required>
                </div>

                <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 py-4 rounded-2xl font-black text-sm tracking-widest transition-all shadow-lg shadow-indigo-500/20">
                    CREATE ACCOUNT
                </button>

            </form>

            <div class="mt-8 pt-8 border-t border-white/5 text-center">
                <p class="text-gray-500 text-sm font-medium">
                    Already have an account?
                    <a href="/login" class="text-indigo-400 font-bold hover:underline">Login</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("signupForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const response = await fetch("/api/signup", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: name,
                    email: email,
                    password: password
                })
            });

            const data = await response.json();

            if (data.success) {
                alert("Account created successfully!");
                window.location.href = "/login";
            } else {
                alert(data.message || "Signup failed");
            }
        });
    </script>

</body>
</html>
