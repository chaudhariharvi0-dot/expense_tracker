<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History | SpendWise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #05070a; color: #ffffff; }
        .glass-card { background: rgba(15, 18, 26, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="p-6 md:p-12">
    <div class="max-w-4xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-12">
            <div>
                <a href="index.html" class="text-indigo-400 text-xs font-bold uppercase tracking-widest hover:underline">← Back to Dashboard</a>
                <h1 class="text-4xl font-black mt-2">Full History</h1>
            </div>
            <button onclick="window.location.href='track.html'" class="bg-indigo-600 px-6 py-3 rounded-2xl font-bold text-sm btn-glow">
                + Add New
            </button>
        </div>

        <div id="historyList" class="space-y-4">
            <div class="glass-card p-6 rounded-[2rem] flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-white/5 rounded-2xl flex items-center justify-center">
                        <i class="fas fa-shopping-bag text-indigo-400"></i>
                    </div>
                    <div>
                        <p class="font-bold">Amazon Purchase</p>
                        <p class="text-xs text-gray-500 font-bold uppercase">24 Jan 2026</p>
                    </div>
                </div>
                <p class="font-black text-rose-500">-₹2,499</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
