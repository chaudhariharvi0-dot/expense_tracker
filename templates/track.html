<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Transaction | SpendWise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: #05070a;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }

        .entry-card {
            background: rgba(15, 18, 26, 0.9);
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            border-radius: 2rem;
        }

        .cat-btn.selected {
            border: 2px solid #6366f1;
            background: rgba(99, 102, 241, 0.2) !important;
        }

        .currency-input {
            display: flex;
            gap: 10px;
        }

        .currency-select {
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.5);
            color: white;
            padding: 10px;
            border-radius: 8px;
            width: 100px;
        }
    </style>
</head>

<body>

<div class="entry-card">

    <div class="flex justify-between mb-6">
        <h2 class="text-2xl font-bold">New Entry</h2>
        <a href="/" class="text-gray-400 hover:text-white">
            <i class="fas fa-times"></i>
        </a>
    </div>

    <!-- TYPE TOGGLE -->
    <div class="flex bg-white/5 p-1 rounded-xl mb-6">
        <button onclick="setType('expense')" id="expenseBtn"
            class="flex-1 py-2 rounded-lg bg-rose-500 font-bold">
            Expense
        </button>
        <button onclick="setType('income')" id="incomeBtn"
            class="flex-1 py-2 rounded-lg font-bold">
            Income
        </button>
    </div>

    <!-- FORM -->
    <form id="transactionForm" class="space-y-4">

        <input type="hidden" id="transaction_type" value="expense">
        <input type="hidden" id="selectedCategory" required>

        <!-- AMOUNT WITH CURRENCY -->
        <div class="currency-input">
            <input id="amount" type="number" step="0.01"
                placeholder="Amount"
                class="flex-1 p-3 rounded-lg bg-gray-800 text-white" required>
            
            <select id="currency" class="currency-select">
                <option value="INR">₹ INR</option>
                <option value="USD">$ USD</option>
                <option value="EUR">€ EUR</option>
                <option value="GBP">£ GBP</option>
                <option value="JPY">¥ JPY</option>
                <option value="AUD">A$ AUD</option>
                <option value="CAD">C$ CAD</option>
                <option value="CHF">CHF</option>
                <option value="CNY">¥ CNY</option>
                <option value="SEK">kr SEK</option>
            </select>
        </div>

        <input id="date" type="date"
            class="w-full p-3 rounded-lg bg-gray-800 text-white" required>

        <input id="note" type="text"
            placeholder="Note (optional)"
            class="w-full p-3 rounded-lg bg-gray-800 text-white">

        <!-- CATEGORY SELECTOR -->
        <div>
            <label class="text-xs text-gray-400 mb-2 block">Select Category</label>
            <div class="grid grid-cols-3 gap-2 mt-3">
                <button type="button" onclick="selectCategory(this,'Food')" class="cat-btn p-3 bg-gray-800 rounded">🍔 Food</button>
                <button type="button" onclick="selectCategory(this,'Shopping')" class="cat-btn p-3 bg-gray-800 rounded">🛍️ Shop</button>
                <button type="button" onclick="selectCategory(this,'Bills')" class="cat-btn p-3 bg-gray-800 rounded">📄 Bills</button>
                <button type="button" onclick="selectCategory(this,'Salary')" class="cat-btn p-3 bg-gray-800 rounded">💰 Salary</button>
                <button type="button" onclick="selectCategory(this,'Investment')" class="cat-btn p-3 bg-gray-800 rounded">📈 Invest</button>
                <button type="button" onclick="selectCategory(this,'Entertainment')" class="cat-btn p-3 bg-gray-800 rounded">🎬 Entertain</button>
                <button type="button" onclick="selectCategory(this,'Transportation')" class="cat-btn p-3 bg-gray-800 rounded">🚗 Transport</button>
                <button type="button" onclick="selectCategory(this,'Health')" class="cat-btn p-3 bg-gray-800 rounded">🏥 Health</button>
                <button type="button" onclick="selectCategory(this,'Other')" class="cat-btn p-3 bg-gray-800 rounded">📌 Other</button>
            </div>
        </div>

        <button type="submit"
            class="w-full mt-4 bg-indigo-600 py-3 rounded-lg font-bold hover:bg-indigo-700">
            Save Transaction
        </button>
    </form>

</div>

<script>
function setType(type) {
    document.getElementById("transaction_type").value = type;

    const exp = document.getElementById("expenseBtn");
    const inc = document.getElementById("incomeBtn");

    if (type === "expense") {
        exp.classList.add("bg-rose-500");
        exp.classList.remove("bg-gray-800");
        inc.classList.remove("bg-emerald-500");
        inc.classList.add("bg-gray-800");
    } else {
        inc.classList.add("bg-emerald-500");
        inc.classList.remove("bg-gray-800");
        exp.classList.remove("bg-rose-500");
        exp.classList.add("bg-gray-800");
    }
}

function selectCategory(btn, category) {
    document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    document.getElementById("selectedCategory").value = category;
}

// Set today's date as default
document.getElementById("date").valueAsDate = new Date();

document.getElementById("transactionForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const data = {
        type: document.getElementById("transaction_type").value,
        amount: document.getElementById("amount").value,
        currency: document.getElementById("currency").value,
        category: document.getElementById("selectedCategory").value,
        note: document.getElementById("note").value,
        date: document.getElementById("date").value
    };

    if (!data.category) {
        alert("Please select a category");
        return;
    }

    fetch("/api/transactions", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(response => {
        if (response.success) {
            alert("Transaction Added!");
            window.location.href = "/";
        } else {
            alert("Error adding transaction");
        }
    });
});
</script>

</body>
</html>
