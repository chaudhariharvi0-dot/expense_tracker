<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SpendWise</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-[#05070a] text-white p-6">

<div class="w-full max-w-md bg-white/5 p-10 rounded-[2.5rem] border border-white/10">
    <h2 class="text-3xl font-black text-center mb-6">Welcome Back</h2>

    <form id="loginForm" class="space-y-5">

        <input id="identifier"
               type="text"
               placeholder="Email or Username"
               class="w-full px-6 py-4 rounded-2xl bg-white/5 border border-white/10 text-sm"
               required>

        <input id="password"
               type="password"
               placeholder="Password"
               class="w-full px-6 py-4 rounded-2xl bg-white/5 border border-white/10 text-sm"
               required>

        <button id="loginBtn"
                type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 py-4 rounded-2xl font-bold text-sm transition">
            LOGIN
        </button>

    </form>

    <p class="mt-6 text-center text-gray-400 text-sm">
        New here?
        <a href="/signup" class="text-indigo-400 font-bold">Create Account</a>
    </p>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const identifier = document.getElementById("identifier").value.trim();
    const password = document.getElementById("password").value.trim();
    const button = document.getElementById("loginBtn");

    if (!identifier || !password) {
        alert("Please fill all fields");
        return;
    }

    button.disabled = true;
    button.innerText = "Logging in...";

    try {
        const response = await fetch("/api/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                identifier: identifier,
                password: password
            })
        });

        const data = await response.json();

        if (data.success) {
            window.location.href = "/";
        } else {
            alert(data.message || "Invalid credentials");
            button.disabled = false;
            button.innerText = "LOGIN";
        }

    } catch (error) {
        console.error("Login error:", error);
        alert("Server error. Please try again.");
        button.disabled = false;
        button.innerText = "LOGIN";
    }
});
</script>

</body>
</html>
